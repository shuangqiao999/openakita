name: Release Build Pipeline (Windows Only) - Rust Backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传/发布到的 tag（例如 v1.2.7）。留空则从代码自动获取。"
        required: false
        default: ""
      ref:
        description: "要构建的 commit SHA 或分支（留空则使用 tag 指向的 commit）"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      ref: ${{ steps.get_version.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 Rust workspace 获取版本号
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${TAG#v}"
            echo "使用手动指定的 tag: ${TAG}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${{ github.ref_name }}"
            echo "使用 push tag: ${TAG}"
          else
            VERSION=$(grep -m 1 '^version = ".*"' openakita_rs/Cargo.toml | cut -d'"' -f2)
            if [ -z "$VERSION" ]; then
              echo "错误: 无法从 openakita_rs/Cargo.toml 获取版本号"
              exit 1
            fi
            TAG="v${VERSION}"
            echo "从代码自动获取版本: ${VERSION}"
          fi

          if [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            REF="${{ github.ref_name }}"
          else
            REF="${{ github.sha }}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ref=${REF}" >> $GITHUB_OUTPUT

          echo "📦 版本号: ${VERSION}"
          echo "🏷️ 标签: ${TAG}"
          echo "🔖 提交: ${REF}"

  create_release:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get_version.outputs.ref }}
          fetch-depth: 0

      - name: 检查发布是否已存在
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.get_version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ 发布 $RELEASE_TAG 已存在 — 将上传新的构建产物"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📦 发布 $RELEASE_TAG 不存在 — 将创建草稿"
          fi

      - name: 创建草稿发布
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_version.outputs.tag }}
          draft: true
          generate_release_notes: true

  windows_release:
    needs: [create_release, get_version]
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.get_version.outputs.tag }}
      CHECKOUT_REF: ${{ needs.get_version.outputs.ref }}
      # Rust 后端优化标志
      RUSTFLAGS: "-C target-cpu=core-avx2 -C opt-level=3 -C debuginfo=0"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_BUILD_JOBS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get_version.outputs.ref }}
          fetch-depth: 0

      - name: 显示构建信息
        shell: bash
        run: |
          echo "=========================================="
          echo "🔨 Windows 发行版构建 (Rust 后端 + Tauri)"
          echo "=========================================="
          echo "版本标签: ${{ env.RELEASE_TAG }}"
          echo "提交引用: ${{ env.CHECKOUT_REF }}"
          echo "Rust workspace: openakita_rs/"
          echo "Tauri 项目: apps/setup-center/"
          echo "技能目录: skills/"
          echo "=========================================="

      - name: 验证版本一致性 (Tag Push)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m 1 '^version = ".*"' openakita_rs/Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${{ needs.get_version.version }}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ 标签版本 $TAG_VERSION 与 openakita_rs/Cargo.toml 版本 $CARGO_VERSION 不匹配"
            exit 1
          fi
          echo "✅ 版本一致性验证通过: $TAG_VERSION"

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'apps/setup-center/package-lock.json'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: openakita_rs

      - name: 安装前端依赖
        working-directory: apps/setup-center
        run: npm ci --no-audit --no-fund

      - name: 构建 Web 前端 (React)
        working-directory: apps/setup-center
        run: npm run build:web   # 根据原项目脚本，可能是 npm run build:web

      - name: 编译 Rust 后端 Workspace (Release)
        working-directory: openakita_rs
        shell: bash
        run: |
          echo "🦀 编译 Rust 后端 (AVX2 优化)"
          cargo build --release --workspace --verbose
          echo "✅ 编译完成"
          echo "产物列表:"
          ls -la target/release/

      - name: 复制 Rust 后端动态库到 Tauri 资源目录
        shell: bash
        run: |
          RESOURCE_DIR="apps/setup-center/src-tauri/resources/openakita-backend"
          mkdir -p "$RESOURCE_DIR"
          # 复制所有 .dll 文件（从 openakita_rs/target/release）
          find openakita_rs/target/release -maxdepth 1 -name "*.dll" -exec cp -f {} "$RESOURCE_DIR/" \;
          echo "✅ Rust 后端库已复制到: $RESOURCE_DIR"
          ls -la "$RESOURCE_DIR"

      - name: 复制技能文件夹到 Tauri 资源目录
        shell: bash
        run: |
          if [ -d "skills" ]; then
            SKILL_COUNT=$(find skills -name 'SKILL.md' -type f | wc -l)
            echo "📦 发现技能文件夹，包含 $SKILL_COUNT 个技能"
            cp -r skills "apps/setup-center/src-tauri/resources/"
            echo "✅ 技能已复制到 apps/setup-center/src-tauri/resources/skills"
          else
            echo "⚠️ 未找到 skills/ 目录，跳过"
          fi

      - name: 构建 Tauri Windows 安装包 (NSIS)
        working-directory: apps/setup-center
        timeout-minutes: 60
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: "-C target-cpu=core-avx2 -C opt-level=3 -C debuginfo=0"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_BUILD_JOBS: "4"
        run: |
          echo "🚀 构建 Tauri Windows 安装包"
          cargo tauri build --bundles "nsis" --verbose
          echo "✅ 构建完成"

      - name: 收集 Windows 安装包
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/setup-center/src-tauri/target/release/bundle"
          OUT_DIR="${BUNDLE_DIR}/_upload"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          found=0
          while IFS= read -r -d '' f; do
            case "$f" in
              */nsis/*.exe)
                if [[ "$(basename "$f")" != *"uninstall"* ]]; then
                  base_name="$(basename "$f" .exe)"
                  cp -f "$f" "${OUT_DIR}/${base_name}_windows-x64.exe"
                  found=$((found+1))
                fi
                ;;
            esac
          done < <(find "${BUNDLE_DIR}" -type f -name "*.exe" -print0)

          echo "✅ 已收集 ${found} 个 Windows 安装包"
          ls -la "${OUT_DIR}"

          if [ "${found}" -eq 0 ]; then
            echo "❌ 错误: 未找到 Windows 安装包。" >&2
            exit 1
          fi

      - name: 上传 Windows 安装包到 GitHub 发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT_DIR="apps/setup-center/src-tauri/target/release/bundle/_upload"
          echo "📤 上传产物到 GitHub Release: $RELEASE_TAG"
          gh release upload "${RELEASE_TAG}" "${OUT_DIR}"/* --clobber
          echo "✅ 上传完成"

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            apps/setup-center/src-tauri/target/release/build/**/output
            apps/setup-center/src-tauri/target/release/build/**/stderr
            openakita_rs/target/release/build/**/output
            ~/AppData/Local/tauri/tauri-build*.log
          if-no-files-found: ignore
          retention-days: 7