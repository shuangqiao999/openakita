name: Android Build (APK)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v1.2.7). Leave empty to skip release upload."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/setup-center
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup-center/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: ${{ github.run_number }}"

      - name: Build web assets (Capacitor)
        run: npm run build:cap

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode keystore (if available)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/setup-center/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/apps/setup-center/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEY_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            -Pandroid.injected.version.code=${{ steps.version.outputs.code }} \
            -Pandroid.injected.version.name=${{ steps.version.outputs.name }}

      - name: Build debug APK (fallback)
        if: steps.keystore.outputs.has_keystore == 'false'
        working-directory: apps/setup-center/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            -Pandroid.injected.version.code=${{ steps.version.outputs.code }} \
            -Pandroid.injected.version.name=${{ steps.version.outputs.name }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: apps/setup-center/${{ steps.find_apk.outputs.apk_path }}

      - name: Determine release tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        if: steps.release_tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          BASENAME="OpenAkita-${{ steps.release_tag.outputs.tag }}-android.apk"
          cp "$APK" "$BASENAME"
          gh release upload "${{ steps.release_tag.outputs.tag }}" "$BASENAME" --clobber || true